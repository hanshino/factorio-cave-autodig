[mod-name]
hanshino-cave-autodig=The Cave Auto-Dig

[controls]
autodig-toggle=Toggle auto-dig

[mod-setting-name]
autodig-default-mode=Default dig mode
autodig-tunnel-width=Tunnel width
autodig-include-rubble=Also dig rubble
autodig-enemy-guard=Pause when enemies appear
autodig-stress-margin=Collapse safety margin

[mod-setting-description]
autodig-default-mode=Which mode you get the first time you join this save — after that, the hotkey or the panel is what changes your mode, not this setting. Cursor: point at a rock or rubble pile and it keeps digging it. Forward: hold a movement key into a wall and it digs that way, one layer at a time, as the wall retreats. Auto-clear: no pointing or walking needed — it digs the nearest rock or rubble within your mining reach on its own, and reach grows with your mining-distance research.
autodig-tunnel-width=Forward mode only. A 1-tile corridor cannot fit a belt and a walking character; 3 is the usable width.
autodig-include-rubble=Also auto-dig the rubble left behind by a collapse.
autodig-enemy-guard=Scan for nearby enemies after each dig and stop if the count went up. Digging spawns biters and caverns, so this keeps you from tunnelling into a nest while looking elsewhere.
autodig-stress-margin=Stop auto-digging when nearby rock stress reaches this value. Only takes effect when The Cave's own collapse system (the-cave-collapse-mode) is enabled; does nothing otherwise — The Cave ships with this disabled by default, so most servers will not have this gate active. The Cave's actual collapse threshold is 3.57; lower is more conservative.

[string-mod-setting]
autodig-default-mode-forward=Forward
autodig-default-mode-cursor=Cursor
autodig-default-mode-clear=Auto-clear

