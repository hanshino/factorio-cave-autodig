[mod-name]
hanshino-cave-autodig=洞穴自動挖掘

[controls]
autodig-toggle=切換自動挖掘
autodig-cycle-mode=切換挖掘模式

[mod-setting-name]
autodig-default-mode=預設挖掘模式
autodig-tunnel-width=隧道寬度
autodig-include-rubble=連碎石一起挖
autodig-enemy-guard=偵測到敵人時暫停
autodig-stress-margin=塌陷安全邊界

[mod-setting-description]
autodig-default-mode=玩家啟動時預設用哪個模式。游標：滑鼠指著哪顆石頭或碎石就一直挖它。前進：頂著牆按住方向鍵，就往那個方向一層一層開路，牆退你進。
autodig-tunnel-width=僅前進模式。1 格通道塞不下輸送帶加走人，3 格才實用。
autodig-include-rubble=塌陷後留下的碎石也自動挖掉。
autodig-enemy-guard=每次挖完掃描附近敵人，數量增加就停止。挖掘會生成蟲子和洞穴，這道保險是為了避免在你看別處時挖穿蟲窩。
autodig-stress-margin=附近岩層應力達到這個值就停止自動挖掘。The Cave 的實際塌陷門檻是 3.57，數字越小越保守。

[string-mod-setting]
autodig-default-mode-forward=前進
autodig-default-mode-cursor=游標

[autodig]
enabled=自動挖掘：__1__ 模式
disabled=自動挖掘：關閉
mode-forward=前進
mode-cursor=游標
mode-switched=挖掘模式：__1__
stopped-inventory=自動挖掘已停止：背包放不下了
stopped-stress=自動挖掘已停止：附近岩層應力 __1__（安全上限 __2__），先架設支撐再繼續
stopped-enemy=自動挖掘已停止：附近敵人增加了
stopped-no-character=自動挖掘已停止：目前沒有角色
probe-unavailable=[洞穴自動挖掘] 找不到 The Cave 的應力查詢介面，塌陷安全閘已停用。這通常表示 The Cave 更新後改了內部介面。
gui-open=自動挖掘
gui-title=自動挖掘
gui-power=啟動
gui-mode=模式
gui-width=隧道寬度
gui-rubble=連碎石一起挖
gui-guard=偵測到敵人時暫停
gui-width-1=1 格
gui-width-3=3 格
gui-status=狀態：__1__
gui-state-running=挖掘中
gui-state-idle=待命
gui-state-off=已關閉
